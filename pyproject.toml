[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garden-lab"
version = "0.1.0"
description = "garden_lab core platform, collector runtime, and firmware scaffolding."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0.2",
  "sqlalchemy>=2.0",
  "apscheduler>=3.10",
  "httpx>=0.27",
  "aioesphomeapi>=35,<36",
  "smbus2>=0.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
