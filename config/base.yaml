app:
  name: garden_lab
  timezone: America/New_York
  database_url: sqlite:///data/garden_lab.db
  ingest_base_url: http://127.0.0.1:8000
  automation_interval_seconds: 30

collectors:
  pi_zero_lab:
    label: Lab Pi Zero
    enabled: true

drivers:
  collector_sensor:
    i2c_sht40: growlab.collector.drivers.sensor.i2c_sht40:SHT40Driver
    i2c_tsl2591: growlab.collector.drivers.sensor.i2c_tsl2591:TSL2591Driver
  actuator:
    esphome_switch: growlab.core.drivers.actuator.esphome_switch:ESPHomeSwitchDriver
    tasmota_switch: growlab.core.drivers.actuator.tasmota_switch:TasmotaSwitchDriver

sensors:
  air_lab:
    label: Seedling Air
    enabled: true
    source:
      kind: collector
      collector_id: pi_zero_lab
      driver: i2c_sht40
      poll:
        every_seconds: 60
      config:
        bus: 1
        address: 68
    metrics:
      temperature_c:
        label: Temperature
        unit: C
      humidity_pct:
        label: Humidity
        unit: "%"

  light_lab:
    label: Seedling Light
    enabled: true
    source:
      kind: collector
      collector_id: pi_zero_lab
      driver: i2c_tsl2591
      poll:
        every_seconds: 60
      config:
        bus: 1
        address: 41
        gain: 1
        integration: 1
    metrics:
      lux:
        label: Lux
        unit: lx
      visible:
        label: Visible
        unit: raw
      infrared:
        label: Infrared
        unit: raw

  soil_tray_1:
    label: Soil Tray 1
    enabled: true
    source:
      kind: remote
      protocol: http_push
      auth_token: env:SOIL_TRAY_1_TOKEN
    metrics:
      moisture_pct:
        label: Moisture
        unit: "%"

actuators:
  exhaust_fan:
    label: Exhaust Fan
    driver: esphome_switch
    enabled: true
    config:
      host: env:KAUF_FAN_HOST
      switch_object_id: kauf_plug
    commands:
      power:
        type: bool

  water_pump:
    label: Water Pump
    driver: esphome_switch
    enabled: true
    config:
      host: env:KAUF_PUMP_HOST
      switch_object_id: kauf_plug
    commands:
      power:
        type: bool

  warm_pads:
    label: Warm Pads
    driver: esphome_switch
    enabled: true
    config:
      host: env:KAUF_PADS_HOST
      switch_object_id: kauf_plug
    commands:
      power:
        type: bool

  lamps:
    label: Lamps
    driver: esphome_switch
    enabled: true
    config:
      host: env:KAUF_LAMPS_HOST
      switch_object_id: kauf_plug
    commands:
      power:
        type: bool

automations:
  garden_equilibrium:
    enabled: true
    mode: garden_v1
    controller:
      climate:
        fan:
          actuator: exhaust_fan
          bands:
            - sensor: air_lab
              metric: temperature_c
              on_above: 28.0
              off_below: 25.5
            - sensor: air_lab
              metric: humidity_pct
              on_above: 78.0
              off_below: 68.0
        heat:
          actuator: warm_pads
          bands:
            - sensor: air_lab
              metric: temperature_c
              on_below: 34.0
              off_above: 34.0
      light:
        actuator: lamps
        schedule:
          start: "06:45"
          end: "22:00"
      watering:
        actuator: water_pump
        mode: schedule
        schedule:
          interval_minutes: 1440
          run_seconds: 10
          anchor: "06:55"
      emergency:
        when:
          any:
            - sensor: air_lab
              metric: temperature_c
              op: ">="
              value: 34.0
            - sensor: air_lab
              metric: humidity_pct
              op: ">="
              value: 90.0
        actions:
          "on":
            - actuator: exhaust_fan
              command:
                power: true
          "off":
            - actuator: warm_pads
              command:
                power: false
            - actuator: lamps
              command:
                power: false

dashboards:
  main:
    title: garden_lab
    layout:
      - panel: sensor_card
        entity: air_lab
      - panel: sensor_card
        entity: light_lab
      - panel: sensor_card
        entity: soil_tray_1
      - panel: actuator_card
        entity: exhaust_fan
      - panel: actuator_card
        entity: water_pump
      - panel: actuator_card
        entity: warm_pads
      - panel: actuator_card
        entity: lamps
      - panel: automation_card
        entity: garden_equilibrium
